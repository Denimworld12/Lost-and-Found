name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  contracts:
    name: Contracts coverage and gas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Fails unless LostAndFound.sol has 100% line coverage.
      - run: pnpm --filter contracts coverage

      # Prints the gas table in the job log and regenerates docs/report/gas.md.
      - run: pnpm --filter contracts gas

  slither:
    name: Slither
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # OpenZeppelin sources come from node_modules.
      - run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Slither and solc 0.8.34
        run: |
          pip install slither-analyzer==0.11.6 solc-select==1.2.0
          solc-select install 0.8.34
          solc-select use 0.8.34

      - name: Run Slither
        working-directory: contracts
        run: slither contracts/LostAndFound.sol --fail-high
